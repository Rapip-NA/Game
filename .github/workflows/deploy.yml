name: Deploy Laravel Project on push to cPanel

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🚀 Build & Deploy via Secure HTTPS
    runs-on: ubuntu-latest

    steps:
      - name: 🛎 Checkout code
        uses: actions/checkout@v4

      # ── PHP ──────────────────────────────────────────────────────────
      - name: 🐘 Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, sqlite3, pdo_sqlite, zip, curl, xml, dom, pcntl, posix, fileinfo
          tools: composer:v2
          coverage: none

      - name: 📄 Temporary Local Env for Build
        run: cp .env.example .env

      - name: 📦 Install Composer dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress --ignore-platform-req=php+
        env:
          COMPOSER_MEMORY_LIMIT: -1

      # ── Node / Vite ──────────────────────────────────────────────────
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install npm dependencies
        run: npm install --ignore-scripts

      - name: 🏗 Build Vite assets
        run: npm run build

      # ── Create Archive (STRICTLY EXCLUDING .env) ──────────────────────
      - name: 📦 Package files into archive
        run: |
          # Hapus .env lokal runner agar mustahil ter-upload ke server
          rm -f .env

          # Simpan di folder parent (../) agar tar tidak membaca arsip yang sedang dibuat
          tar --warning=no-file-changed -czf ../deploy.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.agents' \
            --exclude='tests' \
            --exclude='.phpunit.cache' \
            --exclude='phpunit.xml' \
            --exclude='README.md' \
            .

          mv ../deploy.tar.gz ./deploy.tar.gz
          echo "Ukuran paket deploy: $(ls -lh deploy.tar.gz | awk '{print $5}')"

      # ── Deploy via Secure HTTPS Webhook (Bebas Blokir Firewall) ───────
      - name: 🚀 Push Deploy Package via HTTPS Webhook
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN || 'rapip_deploy_secret_key_884219' }}
        run: |
          echo "Mengirim paket ke server via HTTPS..."
          RESPONSE=$(curl -s -k -X POST \
            -H "X-DEPLOY-KEY: $DEPLOY_TOKEN" \
            -F "package=@deploy.tar.gz" \
            https://game.rapipaja.my.id/deploy_hook.php 2>&1 || true)

          echo "Response dari server:"
          echo "$RESPONSE"

          # Jika HTTPS gagal, coba fallback ke HTTP
          if echo "$RESPONSE" | grep -qv '"status":"success"'; then
            echo "Mencoba fallback via HTTP..."
            RESPONSE=$(curl -s -X POST \
              -H "X-DEPLOY-KEY: $DEPLOY_TOKEN" \
              -F "package=@deploy.tar.gz" \
              http://game.rapipaja.my.id/deploy_hook.php 2>&1 || true)
            echo "Response fallback:"
            echo "$RESPONSE"
          fi

          # Validasi status success
          if echo "$RESPONSE" | grep -q '"status":"success"'; then
            echo "✅ DEPLOYMENT BERHASIL 100%!"
          else
            echo "❌ Gagal deploy via webhook. Cek apakah deploy_hook.php sudah ada di server."
            exit 1
          fi
