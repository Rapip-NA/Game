name: Deploy Laravel Project on push to cPanel

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🚀 Build & Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: 🛎 Checkout code
        uses: actions/checkout@v4

      # ── PHP ──────────────────────────────────────────────────────────
      - name: 🐘 Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, sqlite3, pdo_sqlite, zip, curl, xml, dom, pcntl, posix, fileinfo
          tools: composer:v2
          coverage: none

      - name: 📄 Temporary Local Env for Build
        run: cp .env.example .env

      - name: 📦 Install Composer dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress --ignore-platform-req=php+
        env:
          COMPOSER_MEMORY_LIMIT: -1

      # ── Node / Vite ──────────────────────────────────────────────────
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install npm dependencies
        run: npm install --ignore-scripts

      - name: 🏗 Build Vite assets
        run: npm run build

      # ── Create Archive (STRICTLY EXCLUDING .env) ──────────────────────
      - name: 📦 Package files into archive
        run: |
          # Hapus .env lokal runner agar mustahil ter-upload ke server
          rm -f .env

          # Buat archive tarball dengan mengecualikan file rahasia/besar
          tar -czf deploy.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.agents' \
            --exclude='tests' \
            --exclude='.phpunit.cache' \
            --exclude='phpunit.xml' \
            --exclude='README.md' \
            --exclude='deploy.tar.gz' \
            .

      # ── Upload single archive via SCP ───────────────────────────────
      - name: 📂 Upload archive via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          source: "deploy.tar.gz"
          target: "~/domains/game.rapipaja.my.id/public_html"
          rm: false

      # ── Extract & run post-deploy commands via SSH ───────────────────
      - name: ⚡ Extract & Run post-deploy commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            cd ~/domains/game.rapipaja.my.id/public_html

            echo "=== EXTRACTING DEPLOY ARCHIVE ==="
            # Extract file-file baru (tidak akan menimpa .env yang ada di server)
            tar -xzf deploy.tar.gz
            rm -f deploy.tar.gz

            echo "=== DETECTING PHP VERSIONS ON SERVER ==="
            PHP_BIN=""
            for p in \
              /usr/local/php84/bin/php \
              /usr/local/php83/bin/php \
              /usr/local/php82/bin/php \
              /usr/local/bin/php84 \
              /usr/local/bin/php83 \
              /usr/local/bin/ea-php84 \
              /usr/local/bin/ea-php83 \
              /opt/alt/php84/usr/bin/php \
              /opt/alt/php83/usr/bin/php \
              /opt/cpanel/ea-php84/root/usr/bin/php \
              /opt/cpanel/ea-php83/root/usr/bin/php \
              $(which php84 2>/dev/null) \
              $(which php8.4 2>/dev/null) \
              $(which php83 2>/dev/null) \
              $(which php8.3 2>/dev/null) \
              $(which php 2>/dev/null); do
              if [ -n "$p" ] && [ -x "$p" ]; then
                ver=$("$p" -r 'echo PHP_VERSION;' 2>/dev/null || true)
                echo "Found: $p -> $ver"
                if [ -z "$PHP_BIN" ]; then
                  case "$ver" in
                    8.4*|8.3*|8.2*) PHP_BIN="$p" ;;
                  esac
                fi
              fi
            done

            if [ -z "$PHP_BIN" ]; then
              PHP_BIN=$(which php)
              echo "Warning: No PHP 8.2+ found, using default: $PHP_BIN"
            fi

            echo "=== USING PHP: $PHP_BIN ($($PHP_BIN -r 'echo PHP_VERSION;')) ==="

            # Pastikan .env ada (jika baru pertama kali, buat dan generate key)
            if [ ! -f .env ]; then
              echo "Notice: .env belum ada di server, membuat .env baru..."
              cp .env.example .env
              $PHP_BIN artisan key:generate --force
            else
              echo "OK: .env di server tetap aman dan tidak tersentuh."
            fi

            # Pastikan permissions folder storage dan bootstrap/cache aman
            mkdir -p storage/framework/{sessions,views,cache} storage/logs bootstrap/cache
            chmod -R 775 storage bootstrap/cache 2>/dev/null || true

            $PHP_BIN artisan config:clear || true
            $PHP_BIN artisan route:clear || true
            $PHP_BIN artisan view:clear || true
            $PHP_BIN artisan migrate --force || true
