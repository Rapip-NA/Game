name: Deploy Laravel Project on push to cPanel

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🚀 Build & Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: 🛎 Checkout code
        uses: actions/checkout@v4

      # ── PHP ──────────────────────────────────────────────────────────
      - name: 🐘 Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, sqlite3, pdo_sqlite
          coverage: none

      - name: 📦 Install Composer dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      # ── Node / Vite ──────────────────────────────────────────────────
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install npm dependencies
        run: npm install --ignore-scripts

      - name: 🏗 Build Vite assets
        run: npm run build

      # ── Upload via SCP (SSH file transfer) ───────────────────────────
      - name: 📂 Upload files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          source: "."
          target: "~/domains/game.rapipaja.my.id/public_html"
          rm: false
          strip_components: 1
          exclude: >-
            .git,
            .git/**,
            node_modules,
            node_modules/**,
            .env,
            .env.*,
            .agents,
            .agents/**,
            storage/logs/**,
            storage/framework/cache/**,
            storage/framework/sessions/**,
            storage/framework/views/**,
            storage/pail/**,
            tests,
            tests/**,
            .phpunit.cache,
            phpunit.xml,
            README.md

      # ── Post-deploy: jalankan artisan commands di server ─────────────
      - name: ⚡ Run post-deploy commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            cd ~/domains/game.rapipaja.my.id/public_html
            php8.4 artisan config:cache
            php8.4 artisan route:cache
            php8.4 artisan view:cache
            php8.4 artisan migrate --force
